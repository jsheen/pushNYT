# Lint, test, and build every image on each push to main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra train --extra api --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -q   # synthetic data only; no MIND files or vector database needed

  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: pushnyt-api:ci
          cache-from: type=gha,scope=api
      - name: Start the container and hit /health, /push, /metrics
        run: scripts/smoke-api.sh pushnyt-api:ci

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: train
            dockerfile: Dockerfile
          - image: objective
            dockerfile: Dockerfile.objective
          - image: api
            dockerfile: Dockerfile.api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

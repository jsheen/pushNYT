# XGBoost click model on MIND: P(click | user, article, time slot)
seed: 42
data:
  dir: data
  behaviors: behaviors.tsv
  news: news.tsv
  entity_embeddings: entity_embedding.vec
split:
  # MIND-small train covers 2019-11-09 .. 2019-11-14
  fit_end: "2019-11-13"    # earlier impressions: complement stats + user history only
  train_end: "2019-11-14"  # [fit_end, train_end) trains the model; >= train_end is the test set
features:
  text_dim: 64             # TF-IDF -> SVD dimensions for article text
  ctr_prior_strength: 5    # pseudo-impressions shrinking a user's slot engagement rate to the global rate
  emb_top_k: 5             # emb_sim_top5: mean of the k most similar history articles
  emb_close_threshold: 0.5 # emb_n_close: history articles at or above this cosine similarity
  retrieval_k: 100         # emb_retrieval_rank: nearest articles retrieved per user
  exclude: []              # features to leave out, e.g. [sim_text] for an ablation
embeddings:
  model: sentence-transformers/all-MiniLM-L6-v2  # 384-dim; downloaded to data/models
  chroma_dir: chroma       # vector database, under data.dir
  collection: abstracts
  batch_size: 256
model:
  n_estimators: 1000
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  early_stopping_rounds: 50
  valid_fraction: 0.2      # latest share of training rows used for early stopping
evaluation:
  bootstrap_samples: 1000  # impression-level bootstrap replicates for AUC CIs; 0 to skip
  ci_level: 0.95
  min_auc: 0.644           # quality gate: training fails below this test AUC (baseline CI lower bound)
output:
  dir: outputs/full        # each run gets its own folder under outputs/

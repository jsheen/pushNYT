# Push objective: score = (1 - friction) * engagement + friction * novelty
run_dir: outputs/full      # training run whose predictions.parquet to re-rank
friction: 0.2              # 0 = pure click model, 1 = least-seen subcategory
sweep: [0, 0.05, 0.1, 0.15, 0.2, 0.3, 0.4, 0.5, 0.7, 1.0]  # rows of tradeoff.csv / points on tradeoff.png
seed: 42                   # random-ranking baseline curve

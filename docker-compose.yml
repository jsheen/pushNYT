services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: pushnyt-train:latest
    container_name: pushnyt-train
    env_file:
      - path: .env
        required: false
    environment:
      - DATA_DIR=/app/data
      - OUTPUT_DIR=/app/outputs
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./data:/app/data
      - ./outputs:/app/outputs
    command: ["pushnyt-train --config configs/train.yml"]
    shm_size: "2gb"   # PyTorch DataLoader workers need shared memory

  # Interactive dev shell: `docker compose run --rm shell`
  shell:
    extends: train
    container_name: pushnyt-shell
    stdin_open: true
    tty: true
    command: ["bash"]
